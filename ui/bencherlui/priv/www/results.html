<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"></meta>
    <title>BenchErl - UI</title>
    <link rel="stylesheet" type="text/css" href="/static/css/default.css"></link>
    <link rel="shortcut icon" href="/static/images/favicon.ico"></link>
    <script type="text/javascript" src="/static/js/jquery-1.8.2.js"></script>
    <link rel="stylesheet" href="/static/css/smoothness/jquery-ui-1.9.1.custom.css" />
    <script type="text/javascript" src="/static/js/flot-0.7/jquery.flot.js"></script>
    <script type="text/javascript" src="/static/js/jquery-ui-1.9.1.custom.js"></script>
    <script type="text/javascript" src="/static/js/results/results.js"></script>
  </head>
  <body>
    <div id="sindex" style="display: none">2</div>
    <div id="content">
      <div id="header">
        <div id="logo">
          <img src="/static/images/logo.png" width="300px"></img>
        </div>
        <div id="info">

        </div>
        <br style="clear: both" />
      </div>
      <div id="menu">
        <ul>
          <li><a href="/index">About</a></li>
          <li><a href="/results">Results</a></li>
        </ul>
        <br style="clear: both" />
      </div>
      <div id="main">
<div id="results">

  <div id="benchmarks" class="scrollable" style="width:200px;">
    <h4 id="measurementFileListHeader">...</h4>
    <div id="measurementFileListDiv"></div>
    <h4 id="benchmarkListHeader">...</h4>
    <div id="benchmarkListDiv"></div>
    <h4 id="benchmarkRuns">BENCHMARK RUNS</h4>
    <div id="benchmarkRunListDiv" style="display:none;"></div>
  </div>

  <div id="graph">
    <div id="placeholder"></div>
  </div>

  <div id="miniature">
    <b>Select graphs to display:</b>
    <ul id="overviewLegend" style="list-style-type: none;">
    </ul>
    <b>Select graph type:</b><br/>
    <div id="graphTypeRadio">
      <input type="radio" id="radio1" name="graphTypeRadio" value="time" checked="checked">
      <label for="radio1">Time</label>
      <input type="radio" id="radio2" name="graphTypeRadio" value="speedup">
      <label for="radio2">Speedup</label>
    </div>
    <b>Selection:</b><br/>
    <button type="button" id="selectAllButton" >Select All</button>
    <button type="button" id="deselectAllButton" >Deselect All</button>
    <br/>

    Hint: Drag lower left corner to resize<br/>
  </div>

</div>
        <br style="clear: both" />
      </div>
      <div id="footer">
        Copyright © 2011-2014 <a target="_blank" href="http://release-project.eu">RELEASE Project</a><br />.
      </div>
    </div>

  </body>
</html>
